[workspace]
resolver = "2"
members = ["ferry", "mirrorer", "shapeshift", "icalx", "mailsift", "shutterbug", "textract", "relay", "clipsmith", "gridcalc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
blake3 = "=1.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "=4.4.18", features = ["derive"] }
csv = "1.3"
