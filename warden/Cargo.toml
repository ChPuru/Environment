[workspace]
resolver = "2"
members = ["crates/warden-core", "crates/warden-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# each dependency is load-bearing; additions require justification
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
blake3 = "~1.5"
chacha20poly1305 = "0.10"
ciborium = "~0.2"
clap = { version = "~4.4", features = ["derive"] }
fastcdc = "~3.1"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = "1"
zstd = "0.13"
sha2 = "0.10"
hmac = "0.12"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
anyhow = "1"
proptest = "~1.4"
tempfile = "~3.10"
